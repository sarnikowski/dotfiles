[main]
include=~/.local/state/omarchy/current/theme/foot.ini
term=xterm-256color
font=JetBrainsMono Nerd Font:size=12
pad=14x14
initial-window-mode=windowed
workers=0
shell=/usr/bin/fish

[scrollback]
lines=10000
multiplier=7.0

[cursor]
style=block
blink=yes

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste

[text-bindings]
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return

[colors-dark]
# Primary colors
background=282c34
foreground=abb2bf

# Normal / ANSI 0-7 colors
regular0=5c6370  # black
regular1=e06c75  # red
regular2=98c379  # green
regular3=e5c07b  # yellow
regular4=61afef  # blue
regular5=c678dd  # magenta
regular6=56b6c2  # cyan
regular7=abb2bf  # white

# Bright / ANSI 8-15 colors
bright0=4b5263   # bright black
bright1=be5046   # bright red
bright2=98c379   # bright green
bright3=d19a66   # bright yellow
bright4=61afef   # bright blue
bright5=c678dd   # bright magenta
bright6=56b6c2   # bright cyan
bright7=3e4452   # bright white

# Selection highlight colors
selection-background=979eab
selection-foreground=282c34

# Correct format for combined cursor colors: [Text-Inside-Cursor] [Cursor-Block]
cursor=abb2bf abb2bf
