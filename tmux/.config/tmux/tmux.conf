unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

set -g mouse on

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set-option -ga terminal-overrides "alacritty:Tc"

set-option -g allow-rename off

# Ensures neovim updates buffers on external changes
set -g focus-events on

set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

set -g status-position bottom
set -g status-justify left
set -g status-right ''
set -g status-bg default

set -g mode-style "fg=#61AFEF,bg=#1E222A"

set -g message-style "fg=#61AFEF,bg=#1E222A"
set -g message-command-style "fg=#61AFEF,bg=#1E222A"

set -g pane-border-style "fg=#1E222A"
set -g pane-active-border-style "fg=#61AFEF"

set -g status on

set -g status-style "fg=#61AFEF,bg=default"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#000000,bg=#61AFEF,bold] #S #[fg=#61AFEF,bg=#2C323C,nobold,nounderscore,noitalics]"

setw -g window-status-activity-style "underscore,fg=#a9b1d6,bg=#2C323C"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#a9b1d6,bg=#2C323C"
setw -g window-status-format "#[fg=#2C323C,bg=#2C323C,nobold,nounderscore,noitalics]#[default] #I  #W #F #[fg=#2C323C,bg=#2C323C,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#2C323C,bg=#1E222A,nobold,nounderscore,noitalics]#[fg=#61AFEF,bg=#1E222A,bold] #I  #W #F #[fg=#1E222A,bg=#2C323C,nobold,nounderscore,noitalics]"

bind r source-file ~/.config/tmux/tmux.conf

# Install TPM + plugins under ~/.tmux/plugins/ so they stay out of the
# stow-managed dotfiles repo (this config is symlinked in from there).
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'
set -g @plugin 'tmux-plugins/tmux-resurrect'
run '~/.tmux/plugins/tpm/tpm'
